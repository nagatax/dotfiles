[status]
# Display exit information when the previous command fails.
symbol = " "
format = '[\[$symbol$common_meaning$signal_name$maybe_int\]]($style) '
map_symbol = true
# Report failures from every command in a pipeline.
pipestatus = true
pipestatus_segment_format = '[$status]($style)'
disabled = false

