"$schema" = 'https://starship.rs/config-schema.json'

# 左側に表示する主要なプロンプト要素。
format = """
$directory\
$git_branch\
$git_commit\
$git_metrics\
$git_status\
$line_break\
$character"""

# 右側に補助情報と、現在利用中の開発環境を表示する。
right_format = """
$cmd_duration\
$status\
$time\
$c\
$cpp\
$golang\
$lua\
$nodejs\
$php\
$python\
$rust\
$terraform\
$aws\
$azure\
$gcloud\
$docker_context\
$container"""

# 遅い外部コマンドによるプロンプト表示の待ち時間を抑える。
command_timeout = 750

# 入力欄を見やすくするため、プロンプトの前に空行を入れる。
add_newline = true

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cmd_duration]
# 実行時間が表示される場合は、黄色で強調する。
format = 'took [$duration](yellow) '

[cpp]
symbol = " "
disabled = false

[cmake]
symbol = " "

[cobol]
symbol = " "

[conda]
symbol = " "

[container]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[direnv]
symbol = " "

[directory]
# 現在の作業ディレクトリを読み取り専用状態も含めて強調表示する。
style = 'bold blue'
read_only = " 󰌾"

[docker_context]
# Docker の接続先をディレクトリ表示と区別しやすい青で表示する。
symbol = " "
style = 'blue'

[dotnet]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[erlang]
symbol = " "

[fennel]
symbol = " "

[fill]
symbol = " "

[fortran]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
# 使用中の Google Cloud プロジェクトを環境変数から検出して表示する。
symbol = "󱇶 "
format = 'on [$symbol(\($project\))]($style) '
detect_env_vars = ["CLOUDSDK_ACTIVE_CONFIG_NAME", "GOOGLE_CLOUD_PROJECT", "CLOUDSDK_CORE_PROJECT"]

[gleam]
symbol = " "

[git_branch]
symbol = " "

[git_commit]
# タグ付きコミットではタグ名も表示する。
tag_disabled = false
tag_symbol = '  '

[git_metrics]
# Git の追加・削除行数をプロンプトに表示する。
disabled = false

[git_status]
# 作業ツリーの状態とリモートとの差分をひとまとまりで表示する。
format = '([$all_status$ahead_behind]($style) )'

