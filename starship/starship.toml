"$schema" = 'https://starship.rs/config-schema.json'

# Match the prompt colors to the terminal and editor theme.
palette = 'catppuccin_frappe'

# Display the main prompt components on the left.
format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$line_break\
$character"""

# Display supporting information and active development environments on the right.
right_format = """
$cmd_duration\
$status\
$jobs\
$time\
$battery\
$c\
$cpp\
$golang\
$lua\
$nodejs\
$php\
$python\
$rust\
$terraform\
$aws\
$azure\
$gcloud\
$docker_context\
$container\
$username\
$hostname"""

# Limit how long slow external commands may delay prompt rendering.
command_timeout = 750

# Insert a blank line before the prompt to make the input area easier to read.
add_newline = true

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

# Warn as the battery approaches a critical charge level.
[[battery.display]]
threshold = 10
style = 'bold red'

[[battery.display]]
threshold = 20
style = 'bold yellow'

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cmd_duration]
# Highlight command duration in yellow when it is displayed.
format = 'took [$duration](yellow) '

[cpp]
symbol = " "
disabled = false

[cmake]
symbol = " "

[cobol]
symbol = " "

[conda]
symbol = " "

[container]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[direnv]
symbol = " "

[directory]
# Highlight the current directory, including its read-only state.
style = 'bold blue'
# Distinguish the repository root from directories below it.
repo_root_style = 'bold mauve'
read_only = " 󰌾"
# Mark paths that were shortened to fit the prompt.
truncation_symbol = '…/'

[docker_context]
# Display the Docker context in blue to distinguish it from the directory.
symbol = " "
style = 'blue'

[dotnet]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[erlang]
symbol = " "

[fennel]
symbol = " "

[fill]
symbol = " "

[fortran]
symbol = " "

[fossil_branch]
symbol = " "

[gcloud]
# Detect and display the active Google Cloud project from environment variables.
symbol = "󱇶 "
format = 'on [$symbol(\($project\))]($style) '
detect_env_vars = ["CLOUDSDK_ACTIVE_CONFIG_NAME", "GOOGLE_CLOUD_PROJECT", "CLOUDSDK_CORE_PROJECT"]

[gleam]
symbol = " "

[git_branch]
symbol = " "

[git_commit]
# Display tag names for tagged commits.
tag_disabled = false
tag_symbol = '  '

[git_metrics]
# Display counts of added and deleted lines in Git repositories.
disabled = false

[git_status]
# Display the worktree state and remote divergence as a single group.
format = '([$all_status$ahead_behind]($style) )'

[golang]
symbol = " "

[gradle]
symbol = " "

[guix_shell]
symbol = " "

[haskell]
symbol = " "

[haxe]
symbol = " "

[helm]
symbol = " "

[hg_branch]
symbol = " "

[username]
# Identify the remote user only during SSH sessions.
format = '[$user]($style)@'

[hostname]
# Identify the remote host only during SSH sessions.
ssh_symbol = " "
format = '[$ssh_symbol$hostname]($style) '
ssh_only = true

