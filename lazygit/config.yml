gui:
  nerdFontsVersion: "3"
  # Reserve more vertical space for diffs while keeping the command log visible.
  commandLogSize: 4
  # Keep the command log focused on commands instead of a changing startup tip.
  showRandomTip: false
  # Give the focused side panel more height using the default expansion weight.
  expandFocusedSidePanel: true
  # Show change sizes and divergence from the base branch while reviewing.
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  # Identify branch tips directly and match the fuzzy search used by other tools.
  showBranchCommitHash: true
  filterMode: fuzzy
  # Use numeric dates and a 24-hour clock, matching the other terminal tools.
  timeFormat: '2006-01-02'
  shortTimeFormat: '15:04'
  theme:
    activeBorderColor:
      - '#8caaee'
      - bold
    inactiveBorderColor:
      - '#a5adce'
    searchingActiveBorderColor:
      - '#e5c890'
    optionsTextColor:
      - '#8caaee'
    selectedLineBgColor:
      - '#51576d'
    inactiveViewSelectedLineBgColor:
      - '#414559'
    cherryPickedCommitFgColor:
      - '#8caaee'
    cherryPickedCommitBgColor:
      - '#51576d'
    markedBaseCommitFgColor:
      - '#8caaee'
    markedBaseCommitBgColor:
      - '#e5c890'
    unstagedChangesColor:
      - '#e78284'
    defaultFgColor:
      - '#c6d0f5'

  authorColors:
    '*': '#babbf1'

git:
  # Keep remote state fresh without fetching every minute.
  autoFetch: true

refresher:
  # Fetch remotes every 15 minutes.
  fetchInterval: 900

update:
  # Rely on Homebrew instead of checking for updates in Lazygit.
  method: never
