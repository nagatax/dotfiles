# Skip first-run setup because this file manages the preferred behavior.
onboarding = false

[theme]
# Inherit the Catppuccin Frappe palette from the outer terminal.
name = "terminal"

[theme.custom]
# Add depth to the sidebar and panels while preserving the terminal-derived palette.
sidebar_bg = "#292c3c"
active_row_bg = "#414559"
selection_bg = "#51576d"
panel_bg = "#292c3c"
accent = "#8caaee"

[terminal]
# Start a login shell on macOS and inherit the source pane's directory.
shell_mode = "auto"
new_cwd = "follow"
# Skip image rendering, which these panes do not use.
kitty_graphics = false

[update]
# Rely on Homebrew instead of checking for Herdr releases in the background.
version_check = false
# Update agent detection manifests manually when needed.
manifest_check = false

[server]
# Use a wider virtual terminal while no client is attached.
headless_cols = 160
headless_rows = 50

[keys]
# Keep the tmux-style prefix and add indexed and sequential agent, workspace, and tab navigation.
prefix = "ctrl+b"
switch_workspace = "prefix+shift+1..9"
# Focus agents directly with alt+1..9, which Ghostty leaves unbound.
focus_agent = "alt+1..9"
# Use ctrl+alt+n/p instead of alt+n/alt+p, which Ghostty consumes for split navigation.
previous_agent = ["prefix+[", "ctrl+alt+p"]
next_agent = ["prefix+]", "ctrl+alt+n"]
previous_workspace = ["prefix+(", "ctrl+alt+shift+["]
next_workspace = ["prefix+)", "ctrl+alt+shift+]"]
move_tab_previous = ["prefix+<", "ctrl+alt+shift+comma"]
move_tab_next = ["prefix+>", "ctrl+alt+shift+period"]
clear_pane = "prefix+ctrl+k"
# Add prefix-free ctrl+alt chords for frequent actions; Ghostty leaves this family unbound.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
previous_tab = ["prefix+p", "ctrl+alt+["]
next_tab = ["prefix+n", "ctrl+alt+]"]
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
close_pane = ["prefix+x", "ctrl+alt+x"]
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]
# Reach waiting agents and other workspaces without the prefix.
open_notification_target = ["prefix+o", "ctrl+alt+o"]
workspace_picker = ["prefix+w", "ctrl+alt+w"]
goto = ["prefix+g", "ctrl+alt+g"]
cycle_pane_next = ["prefix+tab", "ctrl+alt+tab"]
cycle_pane_previous = ["prefix+shift+tab", "ctrl+alt+shift+tab"]
# Create and rename without the prefix.
new_workspace = ["prefix+shift+n", "ctrl+alt+shift+n"]
new_worktree = ["prefix+shift+g", "ctrl+alt+shift+g"]
rename_workspace = ["prefix+shift+w", "ctrl+alt+shift+w"]
rename_tab = ["prefix+shift+t", "prefix+comma", "ctrl+alt+r"]
rename_pane = ["prefix+shift+p", "ctrl+alt+shift+r"]
# Select scrollback from the keyboard because mouse capture is disabled.
copy_mode = ["prefix+y", "ctrl+alt+y"]
edit_scrollback = ["prefix+e", "ctrl+alt+e"]
# Resize without entering resize mode; Ghostty leaves these chords unbound.
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"
resize_mode = ["prefix+r", "ctrl+alt+m"]
# Swap panes with hjkl, mirroring ctrl+alt+h/j/k/l focus movement.
swap_pane_left = ["prefix+shift+h", "ctrl+alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "ctrl+alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "ctrl+alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "ctrl+alt+shift+l"]
close_tab = ["prefix+shift+x", "ctrl+alt+shift+x"]
help = ["prefix+?", "ctrl+alt+slash"]
last_pane = ["prefix+backtick", "ctrl+alt+backtick"]
open_worktree = ["prefix+alt+w", "ctrl+alt+shift+o"]
remove_worktree = "prefix+alt+shift+w"
# Open settings like cmd+comma; keep close_workspace prefix-only to avoid accidents.
settings = ["prefix+s", "ctrl+alt+comma"]

[[keys.command]]
# Open repository Git operations without changing the tab layout.
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "Open Lazygit"
width = "80%"
height = "80%"

[[keys.command]]
# Ask Claude Code a quick question without changing the tab layout.
key = "prefix+alt+c"
type = "popup"
command = "claude"
description = "Open Claude Code"
width = "80%"
height = "80%"

[[keys.command]]
# Ask Codex a quick question without changing the tab layout.
key = "prefix+alt+x"
type = "popup"
command = "codex"
description = "Open Codex"
width = "80%"
height = "80%"

[[keys.command]]
# Open the current branch's pull request in the browser.
key = "prefix+alt+o"
type = "shell"
command = "gh pr view --web"
description = "Open pull request in browser"

[[keys.command]]
# Edit files in a temporary pane that closes when Neovim exits.
key = "prefix+alt+e"
type = "pane"
command = "nvim"
description = "Open Neovim"

[[keys.command]]
# Run one-off shell commands without changing the tab layout.
key = "prefix+alt+s"
type = "popup"
command = "exec \"${SHELL:-/bin/zsh}\" -l"
description = "Open shell"
width = "80%"
height = "80%"

[[keys.command]]
# Reveal the focused pane's directory in Finder.
key = "prefix+alt+f"
type = "shell"
command = "open \"${HERDR_ACTIVE_PANE_CWD:-.}\""
description = "Open directory in Finder"

[[keys.command]]
# Watch the current branch's pull request checks; wait for Enter so the result stays visible.
key = "prefix+alt+r"
type = "popup"
command = "gh pr checks --watch; read -r _"
description = "Watch pull request checks"
width = "80%"
height = "80%"

[[keys.command]]
# Review pull requests relevant to me; the pager keeps the popup open.
key = "prefix+alt+i"
type = "popup"
command = "GH_FORCE_TTY=1 gh pr status | less -R"
description = "Show pull request status"
width = "80%"
height = "80%"

[[keys.command]]
# Review uncommitted changes without opening Lazygit.
key = "prefix+alt+d"
type = "popup"
command = "git -c color.ui=always diff HEAD | less -R"
description = "Show uncommitted diff"
width = "80%"
height = "80%"

[[keys.command]]
# Open the repository in the browser.
key = "prefix+alt+b"
type = "shell"
command = "gh browse"
description = "Open repository in browser"

[[keys.command]]
# Watch a GitHub Actions run; wait for Enter so the result stays visible.
key = "prefix+alt+p"
type = "popup"
command = "gh run watch; read -r _"
description = "Watch workflow run"
width = "80%"
height = "80%"

[[keys.command]]
# Jot down notes in a shared scratch file.
key = "prefix+alt+n"
type = "popup"
command = "mkdir -p ~/notes && nvim ~/notes/scratch.md"
description = "Open scratch notes"
width = "80%"
height = "80%"

[[keys.command]]
# Browse recent history as a graph.
key = "prefix+alt+l"
type = "popup"
command = "git log --graph --oneline --decorate --color=always | less -R"
description = "Show Git log graph"
width = "80%"
height = "80%"

[[keys.command]]
# Pick a file with a preview and edit it in Neovim.
key = "prefix+alt+t"
type = "popup"
command = "f=$(rg --files | fzf --preview 'bat --color=always {}') && nvim \"$f\""
description = "Find and open file"
width = "80%"
height = "80%"

[[keys.command]]
# Create a pull request for the current branch in the browser.
key = "prefix+alt+shift+o"
type = "shell"
command = "gh pr create --web"
description = "Create pull request in browser"

[[keys.command]]
# List open issues; the pager keeps the popup open.
key = "prefix+alt+shift+i"
type = "popup"
command = "GH_FORCE_TTY=1 gh issue list | less -R"
description = "List issues"
width = "80%"
height = "80%"

[[keys.command]]
# Break the focused pane out into its own tab, like tmux break-pane.
key = "prefix+!"
type = "shell"
command = "herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab"
description = "Move pane to new tab"

[[keys.command]]
# Keep a Claude Code session in its own tab instead of a popup.
key = "prefix+alt+shift+c"
type = "shell"
command = "p=$(herdr tab create --cwd \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\" --label claude --focus | jq -r '.result.root_pane.pane_id') && herdr pane run \"$p\" claude"
description = "Open Claude Code in new tab"

[[keys.command]]
# Keep a Codex session in its own tab instead of a popup.
key = "prefix+alt+shift+x"
type = "shell"
command = "p=$(herdr tab create --cwd \"${HERDR_ACTIVE_PANE_CWD:-$PWD}\" --label codex --focus | jq -r '.result.root_pane.pane_id') && herdr pane run \"$p\" codex"
description = "Open Codex in new tab"

[[keys.command]]
# Pull the focused pane into another tab of this workspace, like tmux join-pane.
key = "prefix+@"
type = "popup"
command = '''t=$(herdr tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r --arg cur "$HERDR_ACTIVE_TAB_ID" '.result.tabs[] | select(.tab_id != $cur) | "\(.tab_id)\t\(.number): \(.label)"' | fzf --delimiter='\t' --with-nth=2.. | cut -f1) && herdr pane move "$HERDR_ACTIVE_PANE_ID" --tab "$t" --split right'''
description = "Move pane to another tab"
width = "60%"
height = "40%"

[[keys.command]]
# Resume a previous Claude Code conversation without changing the tab layout.
key = "prefix+alt+shift+r"
type = "popup"
command = "claude --resume"
description = "Resume Claude Code"
width = "80%"
height = "80%"

[[keys.command]]
# Open a repository under ~/Documents as a new workspace.
key = "prefix+alt+j"
type = "popup"
command = '''d=$(find ~/Documents -maxdepth 3 -name .git -prune | sed 's|/\.git$||' | fzf) && herdr workspace create --cwd "$d" --label "$(basename "$d")" --focus'''
description = "Open repository as workspace"
width = "60%"
height = "60%"

[[keys.command]]
# Review staged changes before committing.
key = "prefix+alt+shift+d"
type = "popup"
command = "git -c color.ui=always diff --cached | less -R"
description = "Show staged diff"
width = "80%"
height = "80%"

[[keys.command]]
# Edit this config and apply it to the running server.
key = "prefix+alt+comma"
type = "popup"
command = "nvim ~/.config/herdr/config.toml && herdr server reload-config"
description = "Edit and reload config"
width = "80%"
height = "80%"

[ui]
# Match the existing selection behavior and prioritize agent supervision.
mouse_capture = false
copy_on_select = true
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"
status_indicators = "symbols"
window_title = "{workspace}: {tab}"
# Avoid a full redraw each time Ghostty regains focus.
redraw_on_focus_gained = false
# Open new tabs immediately; rename them later with prefix+shift+t when needed.
prompt_new_tab_name = false
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
# Show agent state, terminal activity, and location with a clear visual hierarchy.
rows = [
  ["state_icon", { token = "agent", fg = "#ca9ee6", bold = true }, { token = "state_text", fg = "#b5bfe2", dim = true }],
  [{ token = "terminal_title_stripped", fg = "#c6d0f5" }],
  [{ token = "workspace", fg = "#8caaee" }, { token = "tab", fg = "#838ba7", dim = true }],
]

[ui.sidebar.spaces]
# Emphasize the workspace while retaining semantic state and Git-status colors.
rows = [
  ["state_icon", { token = "workspace", fg = "#c6d0f5", bold = true }],
  [{ token = "branch", fg = "#8caaee" }, "git_status"],
]

[ui.toast]
# Let Ghostty deliver stable background-agent notifications.
delivery = "terminal"
delay_seconds = 2

[ui.sound]
# Avoid duplicating the existing Ghostty notifications with sounds.
enabled = false

[session]
# Resume supported agent conversations after a server restart.
resume_agents_on_restore = true

[experimental]
# Keep terminal contents out of persistent session history.
pane_history = false

# Make prefix commands and Japanese input reliable in agent TUIs.
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["codex", "claude"]
cjk_ime_cursor_shape = "steady_block"

[advanced]
# Keep the default per-pane scrollback to limit memory and output processing.
scrollback_limit_bytes = 10000000
