# Configure pane navigation and split management under the default prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind s switch-client -T split-pane
bind -T split-pane h split-window -h -b -c "#{pane_current_path}"
bind -T split-pane j split-window -v -c "#{pane_current_path}"
bind -T split-pane k split-window -v -b -c "#{pane_current_path}"
bind -T split-pane l split-window -h -c "#{pane_current_path}"
bind r switch-client -T resize-pane
bind -T resize-pane h resize-pane -L 5
bind -T resize-pane j resize-pane -D 5
bind -T resize-pane k resize-pane -U 5
bind -T resize-pane l resize-pane -R 5
bind z resize-pane -Z

# Configure session management.
bind S choose-tree -Zs
bind R source-file ~/.tmux.conf \; display "tmux config reloaded :)"
bind X confirm-before kill-session
set -g detach-on-destroy off
set -g renumber-windows on

# Configure terminal behavior and appearance.
set -s escape-time 1
set-option -g mouse on
set -g default-terminal "tmux-256color"
set -g set-titles on
set -s focus-events on
set -g history-limit 50000
set-option -g status-position top
set -g status-bg colour103
set -g status-fg colour215
set -g status-right-length 120
set -g status-left-length 50
set -g window-status-style fg=colour215
set -g pane-active-border-style fg=colour215
set -g @continuum-restore 'on'

# Configure plugins managed by TPM.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Initialize TPM; keep this command at the end of the file.
run '~/.tmux/plugins/tpm/tpm'
