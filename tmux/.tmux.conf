# Configure pane navigation and split management under the default prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind s switch-client -T split-pane
bind -T split-pane h split-window -h -b -c "#{pane_current_path}"
bind -T split-pane j split-window -v -c "#{pane_current_path}"
bind -T split-pane k split-window -v -b -c "#{pane_current_path}"
bind -T split-pane l split-window -h -c "#{pane_current_path}"
bind r switch-client -T resize-pane
bind -T resize-pane h resize-pane -L 5
bind -T resize-pane j resize-pane -D 5
bind -T resize-pane k resize-pane -U 5
bind -T resize-pane l resize-pane -R 5
bind z resize-pane -Z

# Configure session management.
bind c new-window -c "#{pane_current_path}"
bind S choose-tree -Zs
bind R source-file ~/.tmux.conf \; display "tmux config reloaded :)"
bind X confirm-before kill-session
set -g detach-on-destroy off
set -g renumber-windows on

# Configure terminal behavior and appearance.
set -s escape-time 1
set-option -g mouse on
# Show the current line as an absolute number and surrounding lines as relative numbers in copy mode.
set-window-option -g copy-mode-line-numbers hybrid
set -g default-terminal "tmux-256color"
set -g set-titles on
set -s extended-keys on
set -s focus-events on
set -g history-limit 50000
set-window-option -g monitor-activity on
set-option -g status-position top
# Match the status line, windows, panes, and modes to Catppuccin Frappe.
set -g status-style "bg=#303446,fg=#c6d0f5"
set -g status-right-length 120
set -g status-left-length 50
set -g status-justify absolute-centre
set -g status-left "#[fg=#ca9ee6,bg=#303446]#[fg=#303446,bg=#ca9ee6,bold] #S #[fg=#ca9ee6,bg=#303446]"
set -g status-right "#[fg=#838ba7]󰃭 %Y-%m-%d 󰥔 %H:%M "
set -g window-status-format " #I:#W#F "
set -g window-status-current-format "#[fg=#8caaee,bg=#303446]#[fg=#303446,bg=#8caaee,bold] #I:#W#F #[fg=#8caaee,bg=#303446]"
set -g window-status-separator ""
set -g window-status-style "bg=#303446,fg=#a5adce"
set -g window-status-current-style "bg=#303446,fg=#c6d0f5"
set -g window-status-activity-style "fg=#e5c890,bold"
set -g window-status-bell-style "fg=#e78284,bold"
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#8caaee"
set -g pane-border-status top
set -g pane-border-indicators both
set -g display-panes-colour "#626880"
set -g display-panes-active-colour "#8caaee"
set -g message-style "bg=#e5c890,fg=#303446,bold"
set -g message-command-style "bg=#8caaee,fg=#303446,bold"
set -g menu-style "bg=#303446,fg=#c6d0f5"
set -g menu-selected-style "bg=#8caaee,fg=#303446,bold"
set -g menu-border-style "fg=#626880"
set -g menu-border-lines rounded
set -g popup-style "bg=#303446,fg=#c6d0f5"
set -g popup-border-style "fg=#8caaee"
set -g popup-border-lines rounded
set-window-option -g mode-style "bg=#8caaee,fg=#303446,bold"
set-window-option -g tree-mode-preview-style "fg=#626880"
# Distinguish search matches and line numbers in copy mode.
set-window-option -g copy-mode-match-style "bg=#626880,fg=#c6d0f5"
set-window-option -g copy-mode-current-match-style "bg=#e5c890,fg=#303446,bold"
set-window-option -g copy-mode-line-number-style "fg=#838ba7"
set-window-option -g copy-mode-current-line-number-style "fg=#8caaee,bold"
set -g @continuum-restore 'on'

# Configure plugins managed by TPM.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Initialize TPM; keep this command at the end of the file.
run '~/.tmux/plugins/tpm/tpm'
